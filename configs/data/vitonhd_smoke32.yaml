name: VITON-HD-Smoke-32
target: patch_flow.dataloader.DataModuleFromConfig
params:
  batch_size: 1
  val_batch_size: 2
  num_workers: 2
  train:
    target: patch_flow.vton_data.VTONHDDataset
    params:
      root: ${oc.env:VITONHD_ROOT}
      split: train
      pair_list: ${oc.env:VITONHD_SMOKE_DIR}/train_pairs_32.txt
      image_size: 256
      random_flip: true
      random_shift_scale: true
      shift_scale_prob: 0.5
      shift_limit: 0.2
      scale_limit: 0.2
      paired: true
  validation:
    target: patch_flow.vton_data.VTONHDDataset
    params:
      root: ${oc.env:VITONHD_ROOT}
      split: test
      pair_list: ${oc.env:VITONHD_SMOKE_DIR}/validation_pair_unpair.txt
      image_size: 256
      random_flip: false
      random_shift_scale: false
      paired: false
      preview_sample_id: null
