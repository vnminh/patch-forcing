name: VITON-HD-256
target: patch_flow.dataloader.DataModuleFromConfig
params:
  batch_size: 4
  val_batch_size: 4
  num_workers: 4
  train:
    target: patch_flow.vton_data.VTONHDDataset
    params:
      root: ${oc.env:VITONHD_ROOT}
      split: train
      image_size: 256
      random_flip: true
      random_shift_scale: true
      shift_scale_prob: 0.5
      shift_limit: 0.2
      scale_limit: 0.2
      paired: true
  validation:
    target: patch_flow.vton_data.VTONHDDataset
    params:
      root: ${oc.env:VITONHD_ROOT}
      split: test
      image_size: 256
      random_flip: false
      random_shift_scale: false
      paired: true
      preview_sample_id: null
