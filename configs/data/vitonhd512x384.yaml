name: VITON-HD-512x384
target: patch_flow.dataloader.DataModuleFromConfig
params:
  batch_size: 1
  val_batch_size: 1
  num_workers: 4
  train:
    target: patch_flow.vton_data.VTONHDDataset
    params:
      root: ${oc.env:VITONHD_ROOT}
      split: train
      image_size: [512, 384]
      random_flip: true
      # StableVITON spatial augmentation: person and garment are shifted/scaled
      # independently so cross-attention cannot use fixed absolute coordinates.
      random_shift_scale: true
      shift_scale_prob: 0.5
      shift_limit: 0.2
      scale_limit: 0.2
      paired: true
  validation:
    target: patch_flow.vton_data.VTONHDDataset
    params:
      root: ${oc.env:VITONHD_ROOT}
      split: test
      image_size: [512, 384]
      random_flip: false
      random_shift_scale: false
      paired: true
      preview_sample_id: null
