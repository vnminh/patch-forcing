name: VITON-HD-512x384
target: patch_flow.dataloader.DataModuleFromConfig
params:
  batch_size: 1
  val_batch_size: 1
  num_workers: 4
  train:
    target: patch_flow.vton_data.VTONHDDataset
    params:
      root: ${oc.env:VITONHD_ROOT}
      split: train
      image_size: [512, 384]
      random_flip: true
      paired: true
  validation:
    target: patch_flow.vton_data.VTONHDDataset
    params:
      root: ${oc.env:VITONHD_ROOT}
      split: test
      image_size: [512, 384]
      random_flip: false
      paired: true
      preview_sample_id: null
