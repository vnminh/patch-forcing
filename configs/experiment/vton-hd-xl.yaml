# @package _global_
defaults:
  - override /trainer: vton-patch-flow
  - override /data: viton-hd-1024x768
  - override /model: vton-pft-xl
  - override /autoencoder: flux2_ae
  - override /lr_scheduler: constant

name: viton-hd/pft-xl/1024x768

compile: true

data:
  params:
    batch_size: 1
    val_batch_size: 1
    num_workers: 4

model:
  params:
    compile: ${compile}

trainer:
  params:
    condition_encoder:
      params:
        compile: ${compile}

train_params:
  max_steps: 400000
  accumulate_grad_batches: 8
  limit_val_batches: 8
  val_check_interval: 10000
  precision: bf16-mixed
