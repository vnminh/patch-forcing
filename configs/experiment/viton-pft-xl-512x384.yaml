# @package _global_
defaults:
  - override /trainer: vton_patch_flow
  - override /data: vitonhd512x384
  - override /model: vton-pft-xl
  - override /autoencoder: sd_ae
  - override /lr_scheduler: constant

name: vton/pft-xl-512x384

model:
  params:
    gradient_checkpointing: true
    garment_feature_dim: 384
    # SD-VAE encoder taps: 1/4 resolution has 256 channels, 1/2 resolution has 128.
    garment_middle_channels: 256
    garment_detail_channels: 128
    # Inject garment evidence every two blocks. Semantic correspondence is established
    # first, then increasingly fine appearance features carry colour, logos, and text.
    cross_attention_every: 2
    garment_scale_routes: [dino, dino, coarse, coarse, middle, middle, middle, middle,
                            detail, detail, detail, detail, detail, detail]

data:
  params:
    # The detail branch adds 3072 garment keys at 512x384; batch 8 x accum 4 keeps the
    # global batch at 32 within 24 GB.
    batch_size: 8
    val_batch_size: 1

trainer:
  params:
    compute_validation_metrics: false
    ema_rate: 0.9999
    train_adapters_only: false
    garment_encoder_name: facebook/dinov2-small
    # Frozen: no gradients, no optimizer state, no retained DINO activations.
    garment_encoder_trainable_blocks: 0
    garment_encoder_input_size: [448, 336]
    garment_encoder_gradient_checkpointing: false
    sample_kwargs:
      num_steps: 30
      cfg_scale: 1.5
      adaptive: false
      progress: false

train_params:
  max_steps: 100000
  accumulate_grad_batches: 4
  garment_grad_log_every_n_steps: 50
  limit_val_batches: 1
  val_check_interval: 500
  precision: bf16-mixed
