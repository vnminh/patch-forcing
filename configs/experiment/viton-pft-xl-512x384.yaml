# @package _global_
defaults:
  - override /trainer: vton_patch_flow
  - override /data: vitonhd512x384
  - override /model: vton-pft-xl
  - override /autoencoder: sd_ae
  - override /lr_scheduler: constant

name: vton/pft-xl-512x384

model:
  params:
    gradient_checkpointing: true
    garment_feature_dim: 384

data:
  params:
    batch_size: 1
    val_batch_size: 1

trainer:
  params:
    compute_validation_metrics: false
    ema_rate: 0.0
    train_adapters_only: true
    garment_encoder_name: facebook/dinov2-small
    garment_encoder_trainable_blocks: 2
    garment_encoder_input_size: [448, 336]
    garment_encoder_lr: 5.0e-6
    sample_kwargs:
      num_steps: 8
      cfg_scale: 1.5
      adaptive: false
      progress: false

train_params:
  max_steps: 100000
  accumulate_grad_batches: 4
  limit_val_batches: 1
  val_check_interval: 1000
  precision: bf16-mixed
