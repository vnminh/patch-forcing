target: patch_flow.trainer_vton.LatentVTONPatchForcingTrainer
params:
  model: ${oc.select:model, null}
  first_stage: ${oc.select:autoencoder, null}
  flow:
    target: patch_flow.flow_vton.VTONPatchFlowForcing
    params:
      patch_size: 2
      # Garment-forcing: pure noise in the edit region, so the model must read the
      # garment condition instead of the partially clean paired target.
      zero_time_probability: 0.35
      # Detail-refinement coverage: ceiling pinned at t=1. Without this the LTG ceiling
      # sigma(loc+z) starves t>0.9, which is exactly where logo and text detail is written.
      high_time_probability: 0.25
      high_time_spread: 0.25
      timestep_sampler:
        target: patch_flow.timestep_schedules.LogitNormalTruncatedGaussian
        params:
          std: 0.25
          loc: 0.5
          scale: 1.0
  lr: 1e-4
  backbone_lr_multiplier: 0.1
  weight_decay: 0.0
  ema_rate: 0.9999
  lr_scheduler_cfg: ${oc.select:lr_scheduler, null}
  uncertainty_weight: 0.01
  outside_velocity_weight: 0.01
  # First-difference L1 on the predicted clean latent. Target-latent edges (logos, text,
  # colour seams) receive up to 6x weight, and by default this term only runs on the
  # pure-noise samples where garment evidence is indispensable.
  detail_loss_weight: 0.05
  detail_edge_weight: 5.0
  detail_pure_noise_only: true
  garment_dropout_prob: 0.1
  # ---- CORAL-style correspondence supervision -------------------------------------
  # A frozen DINOv3 teacher matches each editable person token to a garment token by
  # cosine similarity; that match is the ground-truth position for the garment
  # cross-attention. Training-time only: nothing here is fed to the network, so
  # inference and the exported checkpoint's conditioning path stay pure SD-VAE.
  # PRIMARY position term: maximise the attention mass landing within nll_radius of the
  # matched key, i.e. constrain WHICH keys are attended to. Watch
  # train/correspondence_target_mass -- measured before this term existed it was 0.05 for
  # coarse and 0.005 for detail, meaning essentially no mass on the target.
  correspondence_nll_weight: 0.3
  # Radius in normalised garment units. It may be a scalar shared by every branch or a
  # mapping keyed by garment scale. The 512x384 experiment overrides it per scale.
  correspondence_nll_radius: 0.05
  # Secondary, smooth long-range pull on the barycentre. Demoted from 1.0: on its own it
  # is satisfied by a sharp BIMODAL map straddling the target, which retrieves a blend of
  # two fabrics -- navy plus lavender reads as uniform violet.
  correspondence_center_weight: 0.25
  # Removes the remaining freedom to answer diffusely. Note it penalises spread, not
  # displacement, so it cannot substitute for the nll term.
  correspondence_entropy_weight: 0.05
  # Appearance-space routing, self-supervised from the paired data and needing no
  # teacher: the mass-weighted garment RGB a person token retrieves must match the RGB
  # that token has in the ground-truth worn image. DINOv3 geometry alone reaches only
  # 0.455 RGB error against 0.119 for the best available garment token, so the remaining
  # colour signal has to be asked for directly. Watch
  # train/correspondence_appearance_error (0.817 = the garment-mean failure mode).
  correspondence_photometric_weight: 1.0
  # Cosine alignment between the actual cross-attention residual OutProj(A @ V) and
  # target-person SD-VAE features. Unlike every attention-map loss above, this directly
  # trains the V and output projections that must carry logos and texture.
  correspondence_value_weight: 0.0
  # Combine direction with magnitude: cosine alone permits a tiny, ineffective residual.
  correspondence_value_cosine_mix: 0.5
  # The target projector is frozen during backward and follows the student slowly after
  # each optimizer step. This removes the moving-target shortcut of using one embedder.
  correspondence_value_target_ema: 0.999
  correspondence_teacher_name: facebook/dinov3-vits16-pretrain-lvd1689m
  # null keeps the dataset resolution (rounded to the teacher patch grid), so the
  # letterboxed aspect ratio is preserved and matched positions are not sheared.
  correspondence_teacher_input_size: null
  correspondence_garment_grid: null
  # Confidence gate on the best cosine similarity. Watch train/correspondence_coverage:
  # if it collapses toward 0 the gate is too aggressive and the loss does nothing.
  correspondence_min_similarity: 0.35
  # > 0 replaces the arg-max match with a softmax-weighted target position.
  correspondence_soft_target_temperature: 0.0
  # Cycle consistency: the matched garment token must match back. Higher precision,
  # lower coverage.
  correspondence_mutual: false
  correspondence_weight_by_similarity: false
  # null supervises every cross-attention block. Restrict to e.g. [coarse, middle] to
  # avoid materialising the detail branch's much larger attention matrices.
  correspondence_scales: null
  correspondence_warmup_steps: 0
  train_adapters_only: false
  save_validation_previews: true
  preview_every_n_validations: 1
  sample_kwargs:
    num_steps: 30
    cfg_scale: 1.0
    adaptive: false
    progress: false
